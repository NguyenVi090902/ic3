<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giáo viên</title><meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#fffaf0;margin:0;color:#222}
main{max-width:960px;margin:0 auto;padding:16px}
.c{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,textarea{font:inherit;padding:8px 10px;border:1.5px solid #d9d4c3;border-radius:10px;margin:4px 0;max-width:100%;box-sizing:border-box}
textarea{width:100%;font-family:monospace;font-size:13px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:#2f6fed;color:#fff;cursor:pointer;margin:2px}
button.g{background:#e9e3cf;color:#333}.tabs{display:flex;flex-wrap:wrap;gap:4px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #eee;padding:6px 8px;text-align:left}
button.dg{background:#d92d20}button.dg:disabled{background:#e9e3cf;color:#999;cursor:not-allowed}label.dt{font-size:14px;font-weight:600;white-space:nowrap}tr.rr{cursor:pointer}tr.rr:hover{background:#fffaf0}tr.sel{background:#fff1d0!important}input[type=checkbox]{width:18px;height:18px;margin:0;cursor:pointer}.bad{color:#b42318}.good{color:#1a7f37}code{background:#f3efe0;padding:2px 6px;border-radius:6px}
.pgr{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:10px 0}.pgr button{padding:6px 12px;min-width:36px;margin:0}.pgr button:disabled{opacity:.45;cursor:not-allowed}.pgr .pi{color:#666;font-size:14px;margin:0 8px 0 0}
.rhd h3{margin:0}.rsum{margin:6px 0;color:#555;font-size:14px}button:disabled{opacity:.45;cursor:not-allowed}.rsum b{color:#222}td.n,th.n{text-align:right;white-space:nowrap}tr.top td{background:#fff7d6}
@media print{.tabs,.noprint{display:none!important}body{background:#fff}.c{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(SB.url,SB.key),app=$('#app'),TYPES=['single','multi','fill','drag','match','connect','sort'];
const rc=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
// Chỉ hiện dữ liệu của N ngày gần nhất (tính cả hôm nay). Đổi số này nếu muốn dài/ngắn hơn.
const KEEP_DAYS=7;
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(KEEP_DAYS-1));return d};
const dl=(name,rows)=>{const t='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()};

sb.auth.getSession().then(({data})=>data.session?shell():login());
function login(){
  app.innerHTML=`<div class="c"><h2>Đăng nhập giáo viên</h2><input id="em" placeholder="Email"><br><input id="pw" type="password" placeholder="Mật khẩu"><br><button id="li">Đăng nhập</button><p id="m" class="bad"></p></div>`;
  $('#li').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?$('#m').textContent=error.message:shell()};
}
function shell(){
  app.innerHTML=`<div class="tabs"><button data-t="Res">📊 Kết quả</button><button data-t="Rep">📑 Báo cáo</button><button data-t="Cls">🏫 Lớp & học sinh</button><button data-t="Qz">❓ Câu hỏi</button><button class="g" id="lo">Thoát</button></div><div id="body"></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>window['v'+b.dataset.t]());
  $('#lo').onclick=async()=>{await sb.auth.signOut();login()};vRes();
}

async function vRes(){
  const [{data:qz},{data:cl}]=await Promise.all([sb.from('quizzes').select('id,title'),sb.from('classes').select('id,school,name').order('school').order('name')]);
  $('#body').innerHTML=`<div class="c" id="rc"><select id="fq"><option value="">Tất cả bài</option>${(qz||[]).map(q=>`<option value="${esc(q.id)}">${esc(q.title)}</option>`).join('')}</select>
    <select id="fc"><option value="">Tất cả lớp</option>${(cl||[]).map(c=>`<option value="${c.id}">${esc(c.school)} - ${esc(c.name)}</option>`).join('')}</select>
    <label class="dt">Từ ngày <input type="date" id="fd1"></label>
    <label class="dt">Đến ngày <input type="date" id="fd2"></label>
    <button id="clr" class="g" title="Bỏ tất cả bộ lọc">✕ Xóa lọc</button>
    <button id="ex" title="Xuất tất cả kết quả theo bộ lọc hiện tại (không chỉ trang này)">⬇ Xuất CSV</button>
    <button id="del" class="dg" disabled>🗑 Xóa đã chọn (<span id="dn">0</span>)</button> <span id="rm" class="bad"></span>
    <div class="rsum" id="wk"></div>
    <div class="pgr" id="pgt"></div>
    <div style="overflow-x:auto"><table id="tb"></table></div>
    <div class="pgr" id="pgb"></div></div>`;
  {const pad=n=>String(n).padStart(2,'0'),yl=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),w=weekStart();
    ['fd1','fd2'].forEach(id=>{$('#'+id).min=yl(w);$('#'+id).max=yl(new Date())});
    $('#wk').textContent='📅 Chỉ hiển thị kết quả '+KEEP_DAYS+' ngày gần nhất (từ '+pad(w.getDate())+'/'+pad(w.getMonth()+1)+'/'+w.getFullYear()+').'}
  const H=['Thời gian','Trường','Lớp','Học sinh','Bài','Điểm'],PS=50,COLS='id,created_at,quiz_id,student_name,score,total,classes(school,name)';
  let rows=[],ids=[],pg=0,total=0;const sel=new Set();
  const toRow=r=>[new Date(r.created_at).toLocaleString('vi-VN'),r.classes?.school||'',r.classes?.name||'',r.student_name,r.quiz_id,r.score+'/'+r.total];
  // câu truy vấn đã áp dụng bộ lọc (dùng cho cả hiển thị từng trang lẫn xuất CSV)
  const mk=()=>{
    let q=sb.from('attempts').select(COLS,{count:'exact'});
    if($('#fq').value)q=q.eq('quiz_id',$('#fq').value);if($('#fc').value)q=q.eq('class_id',$('#fc').value);
    // lọc theo ngày theo giờ địa phương (từ 00:00 của "Từ ngày" đến hết ngày "Đến ngày")
    {let lo=weekStart();if($('#fd1').value){const f=new Date($('#fd1').value+'T00:00:00');if(f>lo)lo=f}   // không bao giờ sớm hơn mốc N ngày
    q=q.gte('created_at',lo.toISOString())}
    if($('#fd2').value){const e=new Date($('#fd2').value+'T00:00:00');e.setDate(e.getDate()+1);q=q.lt('created_at',e.toISOString())}
    return q.order('created_at',{ascending:false}).order('id');
  };
  const upd=()=>{
    $('#dn').textContent=sel.size;$('#del').disabled=!sel.size;
    document.querySelectorAll('#tb .rk').forEach(c=>{c.checked=sel.has(c.value);c.closest('tr').classList.toggle('sel',c.checked)});
    const a=$('#all');if(a){a.checked=ids.length>0&&sel.size===ids.length;a.indeterminate=sel.size>0&&sel.size<ids.length}
  };
  const pgList=(c,n)=>{const o=[];let p=-1;[...new Set([0,c-2,c-1,c,c+1,c+2,n-1])].filter(x=>x>=0&&x<n).sort((x,y)=>x-y).forEach(x=>{if(p>=0&&x-p>1)o.push('…');o.push(x);p=x});return o};
  const pager=()=>{
    const n=Math.max(1,Math.ceil(total/PS)),from=total?pg*PS+1:0,to=Math.min(total,(pg+1)*PS);
    let h=`<span class="pi">${total?`Hiển thị ${from}–${to} / ${total} kết quả`:'Không có kết quả'}</span>`;
    if(n>1)h+=`<button class="g" data-p="${pg-1}"${pg?'':' disabled'}>‹ Trước</button>`+
      pgList(pg,n).map(x=>x==='…'?'<span class="pi">…</span>':`<button class="${x===pg?'cur':'g'}" data-p="${x}">${x+1}</button>`).join('')+
      `<button class="g" data-p="${pg+1}"${pg<n-1?'':' disabled'}>Sau ›</button>`;
    document.querySelectorAll('.pgr').forEach(e=>e.innerHTML=h);
  };
  const load=async(p)=>{
    if(typeof p==='number')pg=p;
    const {data,count,error}=await mk().range(pg*PS,pg*PS+PS-1);
    if(error){if(pg>0){pg=0;return load()}$('#tb').innerHTML='<tr><td class="bad">Lỗi: '+esc(error.message)+'</tr>';return}
    total=count||0;
    ids=(data||[]).map(r=>r.id);sel.clear();
    rows=(data||[]).map(toRow);
    $('#tb').innerHTML='<tr><th style="width:32px"><input type="checkbox" id="all" title="Chọn tất cả (trang này)">'+H.map(h=>`<th>${h}`).join('')+'</tr>'+
      rows.map((r,i)=>`<tr class="rr"><td><input type="checkbox" class="rk" value="${ids[i]}">`+r.map(x=>`<td>${esc(x)}`).join('')+'</tr>').join('');
    pager();upd();
  };
  // chuyển trang
  $('#rc').addEventListener('click',e=>{const b=e.target.closest('.pgr button[data-p]');if(b&&!b.disabled){load(+b.dataset.p);scrollTo(0,0)}});
  // chọn từng dòng (bấm vào ô tick hoặc bất kỳ chỗ nào trên dòng)
  $('#tb').addEventListener('click',e=>{
    if(e.target.id==='all'){ids.forEach(i=>e.target.checked?sel.add(i):sel.delete(i));return upd()}
    const tr=e.target.closest('tr.rr');if(!tr)return;
    const c=tr.querySelector('.rk');
    if(e.target!==c)c.checked=!c.checked;
    c.checked?sel.add(c.value):sel.delete(c.value);upd();
  });
  $('#del').onclick=async()=>{
    const list=[...sel];if(!list.length)return;
    if(!confirm('Xóa '+list.length+' kết quả đã chọn? Không thể hoàn tác.'))return;
    $('#del').disabled=true;$('#rm').textContent='Đang xóa…';let n=0;
    for(let i=0;i<list.length;i+=100){
      const {data,error}=await sb.from('attempts').delete().in('id',list.slice(i,i+100)).select('id');
      if(error){$('#rm').textContent='Lỗi: '+error.message;upd();return}
      n+=(data||[]).length;
    }
    total-=n;pg=Math.min(pg,Math.max(0,Math.ceil(total/PS)-1));   // trang cuối bị xóa hết thì lùi 1 trang
    await load();
    $('#rm').textContent=n<list.length?'Chỉ xóa được '+n+'/'+list.length+' (kiểm tra quyền trong Supabase)':'';
    if(n===list.length){$('#rm').className='good';$('#rm').textContent='Đã xóa '+n+' kết quả ✓';setTimeout(()=>{$('#rm').textContent='';$('#rm').className='bad'},3000)}
  };
  // xuất CSV: lấy TOÀN BỘ kết quả theo bộ lọc (mỗi lần 1000 dòng), không chỉ trang đang xem
  $('#ex').onclick=async()=>{
    const btn=$('#ex'),old=btn.textContent;btn.disabled=true;btn.textContent='Đang xuất…';
    const all=[];let from=0,fail=null;
    for(;;){
      const {data,error}=await mk().range(from,from+999);
      if(error){fail=error;break}
      all.push(...(data||[]).map(toRow));
      if(!data||data.length<1000)break;from+=1000;
    }
    btn.disabled=false;btn.textContent=old;
    if(fail)return alert('Không xuất được: '+fail.message);
    dl('ket-qua.csv',[H,...all]);
  };
  $('#fq').onchange=$('#fc').onchange=$('#fd1').onchange=$('#fd2').onchange=()=>load(0);
  $('#clr').onclick=()=>{$('#fq').value=$('#fc').value=$('#fd1').value=$('#fd2').value='';load(0)};
  load(0);
}

// ---------- Báo cáo theo ngày: mỗi (bài × lớp) là 1 báo cáo, mỗi học sinh lấy điểm CAO NHẤT ----------
async function vRep(){
  const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const dmy=s=>s.split('-').reverse().join('/'),nat=(a,b)=>String(a).localeCompare(String(b),'vi',{numeric:true});
  const hm=t=>new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  const {data:qz}=await sb.from('quizzes').select('id,title');
  const QT=Object.fromEntries((qz||[]).map(q=>[q.id,q.title]));
  $('#body').innerHTML=`<div class="c noprint"><button class="g" id="dp" title="Ngày trước">‹</button> <input type="date" id="rd"> <button class="g" id="dn2" title="Ngày sau">›</button> <button class="g" id="td">Hôm nay</button>
    <select id="rq"></select> <select id="rcl"></select>
    <button id="rex">⬇ Xuất CSV</button> <button class="g" id="rpr">🖨 In</button> <span id="rmsg"></span><div class="rsum" id="wk"></div></div><div id="rout"></div>`;
  let ATT=[],tk=0,SHOWN=[];
  // chỉ cho chọn trong N ngày gần nhất
  const clamp=()=>{
    const a=ymd(weekStart()),b=ymd(new Date());let v=$('#rd').value||b;if(v<a)v=a;if(v>b)v=b;
    $('#rd').min=a;$('#rd').max=b;$('#rd').value=v;$('#dp').disabled=v<=a;$('#dn2').disabled=v>=b;
    $('#wk').textContent='📅 Chỉ hiển thị báo cáo '+KEEP_DAYS+' ngày gần nhất (từ '+dmy(a)+' đến '+dmy(b)+').';
  };
  const fetchDay=async()=>{
    clamp();const d=$('#rd').value;if(!d)return;const my=++tk;
    $('#rmsg').className='';$('#rmsg').textContent='Đang tải…';
    const a=new Date(d+'T00:00:00'),b=new Date(a);b.setDate(b.getDate()+1);
    const all=[];let from=0;
    for(;;){
      const {data,error}=await sb.from('attempts').select('id,created_at,quiz_id,class_id,student_id,student_name,score,total,classes(school,name)')
        .gte('created_at',a.toISOString()).lt('created_at',b.toISOString()).order('created_at').order('id').range(from,from+999);
      if(my!==tk)return;
      if(error){$('#rmsg').className='bad';$('#rmsg').textContent='Lỗi: '+error.message;return}
      all.push(...(data||[]));if(!data||data.length<1000)break;from+=1000;
    }
    ATT=all;$('#rmsg').textContent='';fillFilters();draw();
  };
  const clsKey=r=>r.class_id||'__none',clsLabel=r=>r.classes?r.classes.school+' - '+r.classes.name:'Không rõ lớp';
  const fillFilters=()=>{
    const qv=$('#rq').value,cv=$('#rcl').value;
    const qs=[...new Set(ATT.map(r=>r.quiz_id))].sort(nat),cm=new Map();ATT.forEach(r=>cm.set(clsKey(r),clsLabel(r)));
    const cs=[...cm].sort((x,y)=>nat(x[1],y[1]));
    $('#rq').innerHTML='<option value="">Tất cả bài</option>'+qs.map(x=>`<option value="${esc(x)}"${x===qv?' selected':''}>${esc(QT[x]||x)} (${esc(x)})</option>`).join('');
    $('#rcl').innerHTML='<option value="">Tất cả lớp</option>'+cs.map(([k,l])=>`<option value="${esc(k)}"${k===cv?' selected':''}>${esc(l)}</option>`).join('');
  };
  // gom theo (bài, lớp); mỗi học sinh giữ điểm cao nhất (nếu bằng nhau thì lấy lần làm sớm hơn)
  const build=()=>{
    const qv=$('#rq').value,cv=$('#rcl').value,G=new Map();
    ATT.forEach(r=>{
      if(qv&&r.quiz_id!==qv)return;if(cv&&clsKey(r)!==cv)return;
      const gk=r.quiz_id+'|'+clsKey(r);let g=G.get(gk);
      if(!g)G.set(gk,g={quiz:r.quiz_id,label:clsLabel(r),S:new Map()});
      const sk=r.student_id||'n:'+r.student_name;let st=g.S.get(sk);
      if(!st)g.S.set(sk,{name:r.student_name||'(không rõ)',best:r.score,total:r.total,at:r.created_at,n:1});
      else{st.n++;if(r.score>st.best){st.best=r.score;st.total=r.total;st.at=r.created_at}}
    });
    return [...G.values()].sort((x,y)=>nat(x.quiz,y.quiz)||nat(x.label,y.label)).map(g=>{
      const R=[...g.S.values()].sort((x,y)=>y.best-x.best||nat(x.name,y.name));
      R.forEach((r,k)=>r.rank=k&&r.best===R[k-1].best?R[k-1].rank:k+1);   // bằng điểm thì cùng hạng
      return {...g,R};
    });
  };
  const draw=()=>{
    const d=$('#rd').value,G=build();SHOWN=G;
    if(!G.length){$('#rout').innerHTML=`<div class="c">Không có bài làm nào trong ngày ${esc(dmy(d))}${$('#rq').value||$('#rcl').value?' (theo bộ lọc đang chọn)':''}.</div>`;return}
    $('#rout').innerHTML=G.map((g,gi)=>{
      const R=g.R,sc=R.map(r=>r.best),tot=R[0].total,avg=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
      return `<div class="c rp"><div class="rhd"><h3>📑 Báo cáo ${gi+1}</h3></div>
        <p class="rsum"><b>Bài:</b> ${esc(QT[g.quiz]||g.quiz)} <code>${esc(g.quiz)}</code> · <b>Lớp:</b> ${esc(g.label)} · <b>Ngày:</b> ${esc(dmy(d))}</p>
        <p class="rsum">${R.length} học sinh · Điểm trung bình: <b>${avg}/${tot}</b> · Cao nhất: <b>${Math.max(...sc)}/${tot}</b> · Thấp nhất: <b>${Math.min(...sc)}/${tot}</b></p>
        <div style="overflow-x:auto"><table><tr><th>Hạng<th>Học sinh<th class="n">Điểm cao nhất<th class="n">Số lần làm<th>Lúc làm (lần tốt nhất)</tr>${R.map(r=>`<tr${r.rank<=3?' class="top"':''}><td>${['','🥇','🥈','🥉'][r.rank]||''} ${r.rank}<td>${esc(r.name)}<td class="n"><b>${r.best}/${r.total}</b><td class="n">${r.n}<td>${esc(hm(r.at))}</tr>`).join('')}</table></div></div>`;
    }).join('');
  };
  const shift=n=>{const x=new Date($('#rd').value+'T00:00:00');x.setDate(x.getDate()+n);$('#rd').value=ymd(x);fetchDay()};
  $('#rd').onchange=fetchDay;$('#dp').onclick=()=>shift(-1);$('#dn2').onclick=()=>shift(1);
  $('#td').onclick=()=>{$('#rd').value=ymd(new Date());fetchDay()};
  $('#rq').onchange=$('#rcl').onchange=draw;
  $('#rpr').onclick=()=>window.print();
  $('#rex').onclick=()=>{
    const d=dmy($('#rd').value),rows=[['Báo cáo','Mã bài','Tên bài','Lớp','Ngày','Hạng','Học sinh','Điểm cao nhất','Tổng điểm','Số lần làm','Lúc làm (lần tốt nhất)']];
    SHOWN.forEach((g,gi)=>g.R.forEach(r=>rows.push([gi+1,g.quiz,QT[g.quiz]||'',g.label,d,r.rank,r.name,r.best,r.total,r.n,hm(r.at)])));
    if(rows.length<2)return alert('Không có dữ liệu để xuất');
    dl('bao-cao-'+$('#rd').value+'.csv',rows);
  };
  $('#rd').value=ymd(new Date());fetchDay();
}

async function vCls(){
  const {data}=await sb.from('classes').select('id,school,name,code,students(count)').order('school').order('name');
  $('#body').innerHTML=`<div class="c"><h3>Thêm danh sách học sinh</h3><p>Dán từ Excel, mỗi dòng: <code>Trường, Lớp, Họ tên</code>. Nhập lại tên đã có sẽ được bỏ qua.</p>
    <textarea id="ro" rows="8" placeholder="Tiểu học A	3A	Nguyễn Văn An"></textarea><button id="imp">Nhập</button> <span id="m" class="bad"></span></div>
    <div class="c"><table><tr><th>Trường<th>Lớp<th>Mã lớp (đưa cho học sinh)<th>Số HS<th></tr>${(data||[]).map(c=>`<tr><td>${esc(c.school)}<td>${esc(c.name)}<td><b>${c.code}</b><td>${c.students[0].count}<td><button class="g" data-del="${c.id}">Xóa</button></tr>`).join('')}</table></div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa lớp và học sinh trong lớp?')){await sb.from('classes').delete().eq('id',b.dataset.del);vCls()}});
  $('#imp').onclick=async()=>{
    const L=$('#ro').value.split('\n').map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r.length>=3&&r[0]&&r[1]&&r[2]),
      ex=Object.fromEntries((data||[]).map(c=>[c.school+'|'+c.name,c.id])),by={};
    L.forEach(r=>(by[r[0]+'|'+r[1]]??=[]).push(r.slice(2).join(' ')));
    for(const [k,names] of Object.entries(by)){
      let id=ex[k];
      if(!id){const [school,name]=k.split('|'),{data:n,error}=await sb.from('classes').insert({school,name,code:rc()}).select('id').single();if(error)return $('#m').textContent=error.message;id=n.id}
      const {error}=await sb.from('students').upsert(names.map(name=>({class_id:id,name})),{onConflict:'class_id,name',ignoreDuplicates:true});
      if(error)return $('#m').textContent=error.message;
    }
    vCls();
  };
}

let qLv='';
async function vQz(){
  const [{data},r1]=await Promise.all([sb.from('quizzes').select('id,title,questions').order('created_at',{ascending:false}),sb.from('quiz_notes').select('quiz_id,note,level')]);
  let nt=r1.data;
  if(r1.error){const r2=await sb.from('quiz_notes').select('quiz_id,note');nt=r2.data}   // chưa chạy SQL thêm cột level
  const Z=data||[],N=Object.fromEntries((nt||[]).map(n=>[n.quiz_id,n.note||''])),L=Object.fromEntries((nt||[]).map(n=>[n.quiz_id,n.level||'']));
  const lvs=[...new Set(Z.map(q=>L[q.id]).filter(Boolean))].sort((x,y)=>x.localeCompare(y,'vi',{numeric:true}));
  const sug=[...new Set(['SPARK Level 1','SPARK Level 2','SPARK Level 3',...lvs])];
  if(qLv&&qLv!=='__none'&&!lvs.includes(qLv))qLv='';
  $('#body').innerHTML=`<div class="c"><h3>Thêm / sửa bài ôn</h3><input id="qi" placeholder="Mã bài, vd: spark-lv2-bai1" size="28"> <input id="qt" placeholder="Tiêu đề bài" size="30"> <input id="ql" list="lvl" placeholder="Level, vd: SPARK Level 2" size="24" autocomplete="off"><datalist id="lvl">${sug.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><br>
    <input id="qd" placeholder="Ghi chú cho giáo viên (học sinh không nhìn thấy)" style="width:100%">
    <textarea id="qj" rows="12" placeholder='Dán JSON câu hỏi (xem sample-questions.json)'></textarea><input type="file" id="qf" accept=".json"> <button id="sv">Lưu bài</button> <span id="m" class="bad"></span></div>
    <div class="c"><label class="dt">Lọc theo level: <select id="fl"><option value="">Tất cả level</option>${lvs.map(x=>`<option value="${esc(x)}"${x===qLv?' selected':''}>${esc(x)}</option>`).join('')}<option value="__none"${qLv==='__none'?' selected':''}>(Chưa phân level)</option></select></label> <span id="qc" style="color:#666;font-size:14px"></span>
      <div style="overflow-x:auto"><table id="ql2"></table></div></div>`;
  const draw=()=>{
    const f=$('#fl').value;qLv=f;
    const list=Z.map((q,i)=>[q,i]).filter(([q])=>!f||(f==='__none'?!L[q.id]:L[q.id]===f));
    $('#qc').textContent=list.length+'/'+Z.length+' bài';
    $('#ql2').innerHTML='<tr><th>Bài<th>Level<th>Ghi chú<th>Số câu<th>Link dán vào admin (data.js)<th></tr>'+(list.length?list.map(([q,i])=>`<tr><td>${esc(q.title)}<td>${esc(L[q.id]||'')}<td style="white-space:pre-wrap;color:#666">${esc(N[q.id]||'')}<td>${q.questions.length}<td><code>quiz.html?q=${esc(q.id)}</code><td><button class="g" data-ed="${i}">Sửa</button><button class="g" data-rm="${i}">Xóa</button></tr>`).join(''):'<tr><td colspan="6" style="color:#888">Không có bài nào.</tr>');
    document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const q=Z[b.dataset.ed];$('#qi').value=q.id;$('#qt').value=q.title;$('#ql').value=L[q.id]||'';$('#qd').value=N[q.id]||'';$('#qj').value=JSON.stringify(q.questions,null,1);scrollTo(0,0)});
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa bài này và toàn bộ điểm của bài?')){await sb.from('quizzes').delete().eq('id',Z[b.dataset.rm].id);vQz()}});
  };
  $('#fl').onchange=draw;draw();
  $('#qf').onchange=async e=>{$('#qj').value=await e.target.files[0].text()};
  $('#sv').onclick=async()=>{
    const id=$('#qi').value.trim(),title=$('#qt').value.trim();let qs;
    try{qs=JSON.parse($('#qj').value)}catch(e){return $('#m').textContent='JSON sai: '+e.message}
    if(!/^[\w-]+$/.test(id)||!title)return $('#m').textContent='Mã bài chỉ gồm chữ/số/gạch ngang; cần có tiêu đề';
    if(!Array.isArray(qs)||!qs.length)return $('#m').textContent='Cần một danh sách câu hỏi dạng [ ... ]';
    const bi=qs.findIndex(q=>!TYPES.includes(q.type)||!q.text||(q.type==='sort'?!(Array.isArray(q.groups)&&q.groups.length>1&&Array.isArray(q.items)&&q.items.length&&q.items.every(x=>x&&x.text&&x.group>=0&&x.group<q.groups.length)):q.type==='drag'||q.type==='match'||q.type==='connect'?!q.pairs:!q.answer));
    if(bi>=0)return $('#m').textContent='Câu hỏi không hợp lệ (câu '+(bi+1)+')';
    const {error}=await sb.from('quizzes').upsert({id,title,questions:qs});
    if(error)return $('#m').textContent=error.message;
    const note=$('#qd').value.trim(),level=$('#ql').value.trim();
    const r=(note||level)?await sb.from('quiz_notes').upsert({quiz_id:id,note,level:level||null}):await sb.from('quiz_notes').delete().eq('quiz_id',id);
    if(r.error)return $('#m').textContent='Đã lưu bài, nhưng chưa lưu được level/ghi chú: '+r.error.message+' (đã chạy SQL thêm cột level chưa?)';
    vQz();
  };
}
</script></body></html>
