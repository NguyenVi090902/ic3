<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Làm bài</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--line:#d9dee8;--ok:#22a06b;--no:#e0675c}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#f1f4fa;color:var(--ink);font-size:18px}
main{max-width:1000px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:center;gap:14px;padding:16px 0}
.cnt{font-weight:700;color:var(--pri);font-size:20px;white-space:nowrap}.ic{font-size:34px}
.track{position:relative;flex:1;height:12px;border-radius:9px;background:repeating-linear-gradient(90deg,#d5dbe8 0 10px,transparent 10px 16px)}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:9px;transition:width .4s}
.track em{position:absolute;top:50%;font-style:normal;font-size:28px;transform:translate(-50%,-50%);transition:left .4s}
.card{background:#fff;border-radius:20px;padding:26px 28px;box-shadow:0 2px 12px #1f293712;margin:8px 0}
h1{font-size:28px;margin:0 0 10px}
.q{font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.4;margin-bottom:18px}
.hint{color:var(--mut);margin:-8px 0 14px}
input,select{font:inherit}
.pick select{display:block;width:100%;max-width:440px;margin:0 0 12px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:18px;background:#fff}.pick select:disabled{opacity:.55}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;font-family:inherit;font-size:clamp(17px,2.5vw,21px);padding:14px 18px;background:#f8f9fc;border:2px solid var(--line);border-radius:14px;cursor:pointer;color:inherit}
.opt:disabled{cursor:default}.tx{flex:1}.rs{font-weight:700;font-size:24px}
.mkr{flex:none;width:26px;height:26px;border:2.5px solid #9aa4b8;border-radius:50%;background:#fff}.mkr.sq{border-radius:7px}
.opt.on{border-color:var(--pri);background:#eaf1ff}.opt.on .mkr{border-color:var(--pri);background:var(--pri);box-shadow:inset 0 0 0 5px #fff}
.qimg{display:block;max-width:100%;max-height:300px;margin:0 auto 16px;border-radius:12px}
.opts.imgs{grid-template-columns:repeat(4,1fr)}
.opt.pic{position:relative;flex-direction:column;justify-content:center;gap:8px;padding:14px 10px 12px;text-align:center}
.opt.pic img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:8px}
.opt.pic .mkr{position:absolute;top:10px;left:10px}.opt.pic .rs{position:absolute;top:6px;right:10px}
.opt.pic .tx{flex:none;font-size:.9em}
.opt.right,.slot.good{border-color:var(--ok);background:#e9f7f0}.opt.right .rs{color:#16794f}
.opt.wrong,.slot.bad{border-color:var(--no);background:#fdeceb}.opt.wrong .rs{color:#b42318}
.fillq input{width:9ch;text-align:center;font-size:inherit;font-weight:700;border:0;border-bottom:3px solid var(--pri);background:#f1f5ff;margin:0 6px;padding:2px 4px}
.fillq input.good{background:#e9f7f0;border-color:var(--ok)}.fillq input.bad{background:#fdeceb;border-color:var(--no)}
.mrow{display:flex;align-items:flex-start;gap:20px;background:#f8f9fc;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;font-size:clamp(16px,2.3vw,19px);line-height:1.45}
.mrow .tx{flex:1 1 50%}.mr{flex:1 1 50%;min-width:0}
.mrow select{width:100%;box-sizing:border-box;font-weight:600;font-size:clamp(15px,2.1vw,18px);padding:11px;border:2px solid var(--pri);border-radius:12px;background:#fff}
.mrow select.good{border-color:var(--ok);background:#e9f7f0}.mrow select.bad{border-color:var(--no);background:#fdeceb}
.ans2{margin-top:8px;color:#16794f;font-weight:600;font-size:16px}
.ans{color:#16794f;font-weight:600;font-size:17px;margin-left:8px}
.row{display:flex;align-items:center;gap:12px;background:#f8f9fc;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
.lf{flex:1}.slot{flex:1;min-height:46px;border:2px dashed #9aa4b8;border-radius:10px;padding:4px 8px}
.chip{display:inline-block;background:#fff;border:2px solid var(--pri);color:var(--pri);border-radius:10px;padding:8px 14px;margin:4px;cursor:grab;user-select:none;font-weight:600}
.chip.sel{background:var(--pri);color:#fff}.bank{margin-top:10px;padding:8px;background:#eef1f8;border-radius:12px;min-height:30px}
.fb{margin-top:18px;padding:14px 18px;border-radius:12px;font-size:18px}.fb p{margin:6px 0}
.fb.good{background:#e9f7f0;color:#14573a}.fb.bad{background:#fdeceb;color:#8a1f15}
.ft{display:flex;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid #eceff5}
.go{font-family:inherit;font-weight:700;font-size:19px;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px 28px;cursor:pointer;box-shadow:0 3px 0 #1c4fb8}
.end{text-align:center}.big{font-size:64px}.err{color:#b42318}.okc{color:#16794f;font-weight:600}
@media(max-width:700px){.opts.imgs{grid-template-columns:repeat(2,1fr)}.card{padding:18px}.mrow{flex-direction:column;align-items:stretch;gap:10px}.mrow .tx,.mr{flex:none}.ic{font-size:26px}}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(SB.url,SB.key),qid=new URLSearchParams(location.search).get('q'),app=$('#app');
let quiz,cls,stu,Q,i,right,A,locked,fin,P,sel;
const isPair=q=>q.type==='drag'||q.type==='match';
const O=o=>typeof o==='string'?{text:o}:(o||{});
const img=u=>/^(https?:\/\/|images\/|data:image\/)/i.test(u||'')?esc(u):'';
const lab=(o,k)=>{o=O(o);return o.text||o.alt||'Hình '+(k+1)};

let CL=[];
(async function(){
  const {data}=await sb.from('quizzes').select('*').eq('id',qid||'').maybeSingle();
  if(!data){app.innerHTML='<div class="card">Không tìm thấy bài ôn.</div>';return}
  quiz=data;
  const {data:cl}=await sb.rpc('list_classes');CL=cl||[];
  const schools=[...new Set(CL.map(c=>c.school))];
  app.innerHTML=`<div class="card" style="margin-top:20px"><h1>${esc(quiz.title)}</h1><p>Em hãy chọn trường, lớp và tên của mình:</p>
    <div class="pick"><select id="sc"><option value="">-- Chọn trường --</option>${schools.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
    <select id="cl" disabled><option value="">-- Chọn lớp --</option></select>
    <select id="st" disabled><option value="">-- Chọn tên của em --</option></select></div>
    <button class="go" id="start">Bắt đầu</button></div>`;
  const fill=(el,ph,rows)=>{el.innerHTML=`<option value="">${ph}</option>`+rows.map(r=>`<option value="${esc(r[0])}">${esc(r[1])}</option>`).join('');el.disabled=!rows.length};
  $('#sc').onchange=()=>{fill($('#cl'),'-- Chọn lớp --',CL.filter(c=>c.school===$('#sc').value).map(c=>[c.id,c.name]));fill($('#st'),'-- Chọn tên của em --',[])};
  $('#cl').onchange=async()=>{
    const v=$('#cl').value;if(!v)return fill($('#st'),'-- Chọn tên của em --',[]);
    fill($('#st'),'Đang tải…',[]);
    const {data:s}=await sb.rpc('list_students',{p_class:v});
    fill($('#st'),'-- Chọn tên của em --',(s||[]).map(x=>[x.id,x.name]));
  };
  $('#start').onclick=()=>{
    if(!$('#sc').value||!$('#cl').value||!$('#st').value)return alert('Em hãy chọn đủ trường, lớp và tên nhé');
    try{localStorage.setItem('sel',JSON.stringify({school:$('#sc').value,cls:$('#cl').value}))}catch{}
    cls={id:$('#cl').value};stu=$('#st').value;Q=quiz.questions;i=0;right=0;A=[];fin=false;show();
  };
  let last={};try{last=JSON.parse(localStorage.getItem('sel')||'{}')}catch{}   // nhớ trường + lớp lần trước (không nhớ tên)
  if(last.school&&schools.includes(last.school)){
    $('#sc').value=last.school;$('#sc').onchange();
    if(CL.some(c=>c.id===last.cls)){$('#cl').value=last.cls;await $('#cl').onchange()}
  }
})();

const topbar=f=>{const p=Math.min(Math.max(f*100,3),97);return `<div class="top"><span class="cnt">Câu ${i+1}/${Q.length}</span><span class="ic">🏠</span><div class="track"><i id="pf" style="width:${p}%"></i><em id="pb" style="left:${p}%">🚲</em></div><span class="ic">🏫</span></div>`};
function show(){
  const q=Q[i];locked=false;sel=null;P=null;let b='';
  if(q.type==='fill')b=`<div class="q fillq">${q.text.split('___').map(esc).join('<input autocomplete="off">')}</div>`;
  else{
    b=`<div class="q">${esc(q.text)}</div>`+(img(q.image)?`<img class="qimg" src="${img(q.image)}" alt="">`:'');
    if(q.type==='single'||q.type==='multi')b+=(q.type==='multi'?'<p class="hint">Chọn nhiều đáp án</p>':'')+`<div class="opts${q.options.some(o=>img(O(o).img))?' imgs':''}">${q.options.map((o,k)=>{o=O(o);const u=img(o.img);return `<button class="opt${u?' pic':''}" data-k="${k}"><span class="mkr${q.type==='multi'?' sq':''}"></span>${u?`<img src="${u}" alt="${esc(o.alt||'')}">`:''}${o.text?`<span class="tx">${esc(o.text)}</span>`:''}<span class="rs"></span></button>`}).join('')}</div>`;
    else if(q.type==='match'){const vs=[...new Set(q.pairs.map(x=>x[1]))].sort();
      b+=`<div>${q.pairs.map((p,k)=>`<div class="mrow"><span class="tx">${esc(p[0])}</span><div class="mr"><select data-k="${k}"><option value="">-- Lựa chọn đáp án --</option>${vs.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div></div>`).join('')}</div>`}
    else b+='<p class="hint">Chạm vào chữ rồi chạm vào ô, hoặc kéo thả</p><div class="dq"></div>';
  }
  app.innerHTML=`${topbar(i/Q.length)}<div class="card">${b}<div id="fb"></div><div class="ft"><button class="go" id="ok">Kiểm Tra ✓</button></div></div>`;
  if(q.type==='drag'){P=q.pairs.map(()=>null);drawDrag()}
  if(q.type==='fill')$('.fillq input').focus();
  document.querySelectorAll('.opt').forEach(t=>t.onclick=()=>{
    if(locked)return;
    if(q.type==='single')document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    t.classList.toggle('on');
  });
  $('#ok').onclick=check;scrollTo(0,0);
}

const chip=v=>`<span class="chip${sel===v?' sel':''}" draggable="true" data-v="${esc(v)}">${esc(v)}</span>`;
function drawDrag(){
  const q=Q[i],bank=q.pairs.map(x=>x[1]).filter(x=>!P.includes(x)).sort();
  $('.dq').innerHTML=q.pairs.map((x,k)=>`<div class="row"><span class="lf">${esc(x[0])}</span>→<span class="slot" data-k="${k}">${P[k]?chip(P[k]):''}</span></div>`).join('')+`<div class="bank">${bank.map(v=>chip(v)).join('')}</div>`;
}
function put(k,v){if(locked)return;const o=P.indexOf(v);if(o>-1)P[o]=null;P[k]=v;sel=null;drawDrag()}
document.addEventListener('click',e=>{
  if(locked||!Q||!$('.dq'))return;
  const c=e.target.closest('.chip'),s=e.target.closest('.slot');if(!c&&!s)return;
  if(s&&sel)return put(+s.dataset.k,sel);
  if(c&&s){P[+s.dataset.k]=null;sel=null}else if(c)sel=sel===c.dataset.v?null:c.dataset.v;
  drawDrag();
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c)e.dataTransfer.setData('text/plain',c.dataset.v)});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
document.addEventListener('drop',e=>{const s=e.target.closest&&e.target.closest('.slot');if(!s)return;e.preventDefault();put(+s.dataset.k,e.dataTransfer.getData('text/plain'))});
document.addEventListener('keydown',e=>{
  if(!Q||fin||e.repeat||!$('#ok'))return;
  if(e.key==='Enter'){e.preventDefault();$('#ok').click();return}
  if(!locked&&/^[1-9]$/.test(e.key)&&!/INPUT|SELECT/.test(e.target.tagName)){const t=document.querySelector(`.opt[data-k="${e.key-1}"]`);if(t)t.click()}
});

function collect(q){
  if(q.type==='fill')return [...document.querySelectorAll('.fillq input')].map(x=>x.value.trim());
  if(q.type==='match')return [...document.querySelectorAll('.mrow select')].map(x=>x.value);
  if(q.type==='drag')return P.slice();
  return [...document.querySelectorAll('.opt.on')].map(x=>+x.dataset.k);
}
function ok(q,a){
  if(q.type==='single'||q.type==='multi')return a.length===q.answer.length&&q.answer.every(x=>a.includes(x));
  if(q.type==='fill')return q.answer.every((acc,k)=>[].concat(acc).some(s=>s.toLowerCase()===(a[k]||'').toLowerCase()));
  return q.pairs.every((p,k)=>a[k]===p[1]);
}
const shown=q=>q.type==='fill'?q.answer.map(a=>[].concat(a)[0]).join(' | '):isPair(q)?q.pairs.map(p=>p[0]+' → '+p[1]).join('; '):q.answer.map(x=>lab(q.options[x],x)).join(', ');

function check(){
  if(locked)return;const q=Q[i],a=collect(q);
  if((q.type==='single'||q.type==='multi')&&!a.length)return alert('Em hãy chọn đáp án nhé');
  const r=ok(q,a);locked=true;if(r)right++;A.push(a);mark(q,a);
  const p=Math.min(Math.max((i+1)/Q.length*100,3),97);$('#pf').style.width=p+'%';$('#pb').style.left=p+'%';
  $('#fb').innerHTML=`<div class="fb ${r?'good':'bad'}"><b>${r?'✔ Chính xác!':'✗ Chưa đúng'}</b>${r?'':`<p>Đáp án: ${esc(shown(q))}</p>`}${q.explain?`<p>${esc(q.explain)}</p>`:''}</div>`;
  $('#ok').textContent=i+1<Q.length?'Câu tiếp ▶':'Xem kết quả ▶';$('#ok').onclick=next;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function mark(q,a){
  if(q.type==='single'||q.type==='multi')document.querySelectorAll('.opt').forEach(t=>{
    const k=+t.dataset.k,r=q.answer.includes(k),w=a.includes(k);
    t.disabled=true;t.classList.add(...(r?['right']:w?['wrong']:[]));t.querySelector('.rs').textContent=r?'✓':w?'✗':'';
  });
  else if(q.type==='fill')document.querySelectorAll('.fillq input').forEach((x,k)=>{
    const acc=[].concat(q.answer[k]),g=acc.some(s=>s.toLowerCase()===x.value.trim().toLowerCase());
    x.disabled=true;x.classList.add(g?'good':'bad');if(!g)x.insertAdjacentHTML('afterend',`<small class="ans">✓ ${esc(acc[0])}</small>`);
  });
  else if(q.type==='match')document.querySelectorAll('.mrow').forEach((r,k)=>{
    const g=a[k]===q.pairs[k][1],s=r.querySelector('select');
    s.disabled=true;s.classList.add(g?'good':'bad');if(!g)r.querySelector('.mr').insertAdjacentHTML('beforeend',`<div class="ans2">✓ ${esc(q.pairs[k][1])}</div>`);
  });
  else document.querySelectorAll('.slot').forEach(s=>{
    const k=+s.dataset.k,g=a[k]===q.pairs[k][1];
    s.classList.add(g?'good':'bad');if(!g)s.insertAdjacentHTML('beforeend',`<small class="ans">✓ ${esc(q.pairs[k][1])}</small>`);
  });
}
function next(){if(!locked)return;i++;i<Q.length?show():finish()}
function finish(){
  fin=true;const pc=right/Q.length;
  app.innerHTML=`<div class="card end" style="margin-top:30px"><div class="big">${pc>=.8?'🎉':pc>=.5?'👍':'💪'}</div><h1>Em làm đúng ${right}/${Q.length} câu</h1><p id="sv">Đang lưu điểm…</p><button class="go" onclick="location.reload()">Làm lại</button></div>`;
  save();
}
async function save(){
  const {error}=await sb.rpc('submit_attempt',{p_class:cls.id,p_student:stu,p_quiz:qid,p_score:right,p_total:Q.length,p_answers:A});
  $('#sv').innerHTML=error?'<span class="err">Chưa lưu được điểm.</span> <button class="go" id="rt">Thử lại</button>':'<span class="okc">Đã lưu điểm ✓</span>';
  if(error)$('#rt').onclick=save;
}
</script></body></html>
