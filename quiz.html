<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Làm bài</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
</head><body>
<header class="topbar" id="tb"><div class="wrap"><a class="brand" href="index.html"><span id="siteIcon"></span><span id="siteTitle"></span></a><div class="who" id="who" hidden></div></div></header>
<main class="wrap" id="app"><div class="card">Đang tải…</div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(SB.url,SB.key),qid=new URLSearchParams(location.search).get('q'),app=$('#app');
let SC,quiz,cls,stu,Q,i,right,A,locked,fin,P,sel,pts,t0,who,CL=[],STU=[];
const pk={school:'',cid:'',cname:'',sid:'',sname:''};
// Tên + biểu tượng trang (lấy từ data.js, giống trang chủ)
{const D=window.SITE_DATA||{};$('#siteIcon').textContent=D.siteIcon||'';$('#siteTitle').textContent=D.siteTitle||'Trang chủ'}
const shuf=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
// Xáo trộn thứ tự câu hỏi + đáp án (chỉ số đáp án đúng được đổi theo)
function prep(qs){return shuf(qs.map(q=>{
  q=JSON.parse(JSON.stringify(q));
  if((q.type==='single'||q.type==='multi')&&Array.isArray(q.options)){
    const idx=shuf(q.options.map((_,k)=>k));
    q.options=idx.map(k=>q.options[k]);q.answer=q.answer.map(x=>idx.indexOf(x));
  }else if((q.type==='match'||q.type==='drag')&&Array.isArray(q.pairs))q.pairs=shuf(q.pairs);
  return q}))}
const isPair=q=>q.type==='drag'||q.type==='match';
const O=o=>typeof o==='string'?{text:o}:(o||{});
const img=u=>/^(https?:\/\/|images\/|data:image\/)/i.test(u||'')?esc(u):'';
const lab=(o,k)=>{o=O(o);return o.text||o.alt||'Hình '+(k+1)};


// ---------- Màn hình chọn trường / lớp / tên ----------
const NAT=(a,b)=>String(a).localeCompare(String(b),'vi',{numeric:true});
const nrm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const clsLabel=c=>/^lớp/i.test(c)?c:'Lớp '+c;
const chips=(rows,cur)=>rows.map(r=>`<button type="button" class="pchip${r[0]===cur?' on':''}" data-v="${esc(r[0])}">${esc(r[1])}</button>`).join('');

function sync(){
  $('#s1').classList.toggle('done',!!pk.school);
  $('#s2').classList.toggle('locked',!pk.school);$('#s2').classList.toggle('done',!!pk.cid);
  $('#s3').classList.toggle('locked',!pk.cid);$('#s3').classList.toggle('done',!!pk.sid);
  const ok=!!(pk.school&&pk.cid&&pk.sid);
  $('#start').disabled=!ok;
  $('#sh').textContent=ok?'':'Chọn đủ 3 bước để bắt đầu nhé';
}
function drawCls(){
  const rows=CL.filter(c=>c.school===pk.school).sort((a,b)=>NAT(a.name,b.name));
  $('#clList').innerHTML=`<select class="big" id="cc" ${!pk.school?'disabled':''}><option value="">-- Chọn lớp --</option>${rows.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(pk.cid)?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
}
function drawNames(){
  $('#stList').innerHTML=`<select class="big" id="ss" ${!pk.cid?'disabled':''}><option value="">-- Chọn tên học sinh --</option>${STU.map(s=>`<option value="${esc(s.id)}" ${String(s.id)===String(pk.sid)?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
}
function pickSchool(v){
  Object.assign(pk,{school:v,cid:'',cname:'',sid:'',sname:''});STU=[];
  drawCls();drawNames();sync();
}
async function pickClass(id){
  const c=CL.find(x=>x.id===id);if(!c)return;
  Object.assign(pk,{cid:c.id,cname:c.name,sid:'',sname:''});STU=[];
  drawCls();drawNames();sync();
  const {data}=await sb.rpc('list_students',{p_class:id});
  if(pk.cid!==id)return;            // em đã đổi lớp trong lúc đang tải
  STU=data||[];drawNames();
}
function showWho(){
  const ini=(who.name.trim().split(/\s+/).pop()||'?').charAt(0).toUpperCase();
  const w=$('#who');
  w.innerHTML=`<span class="av">${esc(ini)}</span><span class="wt"><b>${esc(who.name)}</b><small>${esc(clsLabel(who.cls))}, ${esc(who.school)}</small></span>`;
  w.hidden=false;$('#tb').classList.add('has-who');
}
function begin(){Q=prep(quiz.questions);i=0;right=0;pts=0;t0=Date.now();A=[];fin=false;show()}

(async function(){
  const {data}=await sb.from('quizzes').select('*').eq('id',qid||'').maybeSingle();
  if(!data){app.innerHTML='<div class="card"><h1>Ôi, không tìm thấy bài ôn 😢</h1><p>Em hãy kiểm tra lại đường link hoặc nhờ thầy cô gửi lại nhé.</p><a class="go alt" href="index.html">← Về trang chủ</a></div>';return}
  quiz=data;document.title=quiz.title||'Làm bài';
  const {data:cl}=await sb.rpc('list_classes');CL=cl||[];
  const schools=[...new Set(CL.map(c=>c.school))].sort(NAT);
  app.innerHTML=`<section class="hero"><h1>Chào em! <mark>Sẵn sàng</mark> chưa? 👋</h1><p>Chọn trường, lớp và tên của em để bắt đầu nhé.</p><span class="qbadge">📝 ${esc(quiz.title)}</span></section>
  <div class="card pickcard">
    <div class="step" id="s1"><div class="shead"><span class="sn">1</span><b>Em học trường nào?</b></div>
      <select class="big" id="sc"><option value="">-- Chọn trường --</option>${schools.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>
    <div class="step locked" id="s2"><div class="shead"><span class="sn">2</span><b>Em học lớp nào?</b></div>
      <div id="clList"></div></div>
    <div class="step locked" id="s3"><div class="shead"><span class="sn">3</span><b>Tên của em là gì?</b></div>
      <div id="stList"></div></div>
    <div class="startrow"><button class="go big" id="start" disabled>Bắt đầu làm bài ▶</button><span class="sh" id="sh"></span></div>
  </div>`;
  drawCls();drawNames();sync();

  $('#sc').onchange=()=>pickSchool($('#sc').value);
  $('#clList').onchange=()=>pickClass($('#cc').value);
  $('#stList').onchange=()=>{
    const s=STU.find(x=>String(x.id)===$('#ss').value);if(!s){pk.sid='';pk.sname='';}
    else{pk.sid=s.id;pk.sname=s.name;}sync();
  };
  $('#start').onclick=()=>{
    if(!(pk.school&&pk.cid&&pk.sid))return;
    try{localStorage.setItem('sel',JSON.stringify({school:pk.school,cls:pk.cid}))}catch{}
    cls={id:pk.cid};stu=pk.sid;who={name:pk.sname,cls:pk.cname,school:pk.school};
    showWho();begin();
  };

  // nhớ trường + lớp lần trước (không nhớ tên)
  let last={};try{last=JSON.parse(localStorage.getItem('sel')||'{}')}catch{}
  if(last.school&&schools.includes(last.school)){
    $('#sc').value=last.school;pickSchool(last.school);
    if(CL.some(c=>c.id===last.cls))await pickClass(last.cls);
  }
})();

const topbar=f=>{const p=Math.min(Math.max(f*100,3),97);return `<div class="top"><span class="cnt">Câu ${i+1}/${Q.length}</span><span class="ic">🏠</span><div class="track"><i id="pf" style="width:${p}%"></i><em id="pb" style="left:${p}%">🚲</em></div><span class="ic">🏫</span></div>`};
function show(){
  const q=Q[i];locked=false;sel=null;P=null;let b='';
  if(q.type==='fill')b=`<div class="q fillq">${q.text.split('___').map(esc).join('<input autocomplete="off">')}</div>`;
  else{
    b=`<div class="q">${esc(q.text)}</div>`+(img(q.image)?`<img class="qimg" src="${img(q.image)}" alt="">`:'');
    if(q.type==='single'||q.type==='multi')b+=(q.type==='multi'?'<p class="hint">Chọn nhiều đáp án</p>':'')+`<div class="opts${q.options.some(o=>img(O(o).img))?' imgs':''}">${q.options.map((o,k)=>{o=O(o);const u=img(o.img);return `<button class="opt${u?' pic':''}" data-k="${k}"><span class="mkr${q.type==='multi'?' sq':''}"></span>${u?`<img src="${u}" alt="${esc(o.alt||'')}">`:''}${o.text?`<span class="tx">${esc(o.text)}</span>`:''}<span class="rs"></span></button>`}).join('')}</div>`;
    else if(q.type==='match'){const vs=[...new Set(q.pairs.map(x=>x[1]))].sort();
      b+=`<div>${q.pairs.map((p,k)=>`<div class="mrow"><span class="tx">${esc(p[0])}</span><div class="mr"><select data-k="${k}"><option value="">-- Lựa chọn đáp án --</option>${vs.map(v=>`<option>${esc(v)}</option>`).join('')}</select></div></div>`).join('')}</div>`}
    else b+='<p class="hint">Chạm vào chữ rồi chạm vào ô, hoặc kéo thả</p><div class="dq"></div>';
  }
  app.innerHTML=`${topbar(i/Q.length)}<div class="card">${b}<div id="fb"></div><div class="ft"><button class="go" id="ok">Kiểm Tra ✓</button></div></div>`;
  if(q.type==='drag'){P=q.pairs.map(()=>null);drawDrag()}
  if(q.type==='fill')$('.fillq input').focus();
  document.querySelectorAll('.opt').forEach(t=>t.onclick=()=>{
    if(locked)return;
    if(q.type==='single')document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    t.classList.toggle('on');
  });
  $('#ok').onclick=check;scrollTo(0,0);
}

const chip=v=>`<span class="chip${sel===v?' sel':''}" draggable="true" data-v="${esc(v)}">${esc(v)}</span>`;
function drawDrag(){
  const q=Q[i],bank=q.pairs.map(x=>x[1]).filter(x=>!P.includes(x)).sort();
  $('.dq').innerHTML=q.pairs.map((x,k)=>`<div class="row"><span class="lf">${esc(x[0])}</span>→<span class="slot" data-k="${k}">${P[k]?chip(P[k]):''}</span></div>`).join('')+`<div class="bank">${bank.map(v=>chip(v)).join('')}</div>`;
}
function put(k,v){if(locked)return;const o=P.indexOf(v);if(o>-1)P[o]=null;P[k]=v;sel=null;drawDrag()}
document.addEventListener('click',e=>{
  if(locked||!Q||!$('.dq'))return;
  const c=e.target.closest('.chip'),s=e.target.closest('.slot');if(!c&&!s)return;
  if(s&&sel)return put(+s.dataset.k,sel);
  if(c&&s){P[+s.dataset.k]=null;sel=null}else if(c)sel=sel===c.dataset.v?null:c.dataset.v;
  drawDrag();
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(c)e.dataTransfer.setData('text/plain',c.dataset.v)});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
document.addEventListener('drop',e=>{const s=e.target.closest&&e.target.closest('.slot');if(!s)return;e.preventDefault();put(+s.dataset.k,e.dataTransfer.getData('text/plain'))});
document.addEventListener('keydown',e=>{
  if(!Q||fin||e.repeat||!$('#ok'))return;
  if(e.key==='Enter'){e.preventDefault();$('#ok').click();return}
  if(!locked&&/^[1-9]$/.test(e.key)&&!/INPUT|SELECT/.test(e.target.tagName)){const t=document.querySelector(`.opt[data-k="${e.key-1}"]`);if(t)t.click()}
});

function collect(q){
  if(q.type==='fill')return [...document.querySelectorAll('.fillq input')].map(x=>x.value.trim());
  if(q.type==='match')return [...document.querySelectorAll('.mrow select')].map(x=>x.value);
  if(q.type==='drag')return P.slice();
  return [...document.querySelectorAll('.opt.on')].map(x=>+x.dataset.k);
}
function ok(q,a){
  if(q.type==='single'||q.type==='multi')return a.length===q.answer.length&&q.answer.every(x=>a.includes(x));
  if(q.type==='fill')return q.answer.every((acc,k)=>[].concat(acc).some(s=>s.toLowerCase()===(a[k]||'').toLowerCase()));
  return q.pairs.every((p,k)=>a[k]===p[1]);
}
function frac(q,a){
  if(q.type==='single')return ok(q,a)?1:0;
  if(q.type==='multi'){const c=a.filter(x=>q.answer.includes(x)).length,w=a.length-c;return Math.max(0,(c-w)/q.answer.length)}
  if(q.type==='fill')return q.answer.filter((acc,k)=>[].concat(acc).some(s=>s.toLowerCase()===(a[k]||'').toLowerCase())).length/q.answer.length;
  return q.pairs.filter((p,k)=>a[k]===p[1]).length/q.pairs.length;
}
const shown=q=>q.type==='fill'?q.answer.map(a=>[].concat(a)[0]).join(' | '):isPair(q)?q.pairs.map(p=>p[0]+' → '+p[1]).join('; '):q.answer.map(x=>lab(q.options[x],x)).join(', ');

function check(){
  if(locked)return;const q=Q[i],a=collect(q);
  if((q.type==='single'||q.type==='multi')&&!a.length)return alert('Em hãy chọn đáp án nhé');
  const r=ok(q,a),f=frac(q,a);locked=true;if(r)right++;pts+=f;A.push(a);mark(q,a);
  const p=Math.min(Math.max((i+1)/Q.length*100,3),97);$('#pf').style.width=p+'%';$('#pb').style.left=p+'%';
  $('#fb').innerHTML=`<div class="fb ${r?'good':'bad'}"><b>${r?'✔ Chính xác!':f>0?'◐ Đúng một phần':'✗ Chưa đúng'}</b>${r?'':`<p>Đáp án: ${esc(shown(q))}</p>`}${q.explain?`<p>${esc(q.explain)}</p>`:''}</div>`;
  $('#ok').textContent=i+1<Q.length?'Câu tiếp ▶':'Xem kết quả ▶';$('#ok').onclick=next;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function mark(q,a){
  if(q.type==='single'||q.type==='multi')document.querySelectorAll('.opt').forEach(t=>{
    const k=+t.dataset.k,r=q.answer.includes(k),w=a.includes(k);
    t.disabled=true;t.classList.add(...(r?['right']:w?['wrong']:[]));t.querySelector('.rs').textContent=r?'✓':w?'✗':'';
  });
  else if(q.type==='fill')document.querySelectorAll('.fillq input').forEach((x,k)=>{
    const acc=[].concat(q.answer[k]),g=acc.some(s=>s.toLowerCase()===x.value.trim().toLowerCase());
    x.disabled=true;x.classList.add(g?'good':'bad');if(!g)x.insertAdjacentHTML('afterend',`<small class="ans">✓ ${esc(acc[0])}</small>`);
  });
  else if(q.type==='match')document.querySelectorAll('.mrow').forEach((r,k)=>{
    const g=a[k]===q.pairs[k][1],s=r.querySelector('select');
    s.disabled=true;s.classList.add(g?'good':'bad');if(!g)r.querySelector('.mr').insertAdjacentHTML('beforeend',`<div class="ans2">✓ ${esc(q.pairs[k][1])}</div>`);
  });
  else document.querySelectorAll('.slot').forEach(s=>{
    const k=+s.dataset.k,g=a[k]===q.pairs[k][1];
    s.classList.add(g?'good':'bad');if(!g)s.insertAdjacentHTML('beforeend',`<small class="ans">✓ ${esc(q.pairs[k][1])}</small>`);
  });
}
function next(){if(!locked)return;i++;i<Q.length?show():finish()}
function finish(){
  fin=true;const sc=Math.round(pts/Q.length*1000),sec=Math.round((Date.now()-t0)/1000),
    tm=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  const T=sc>=900?{ic:'🏆',bi:'🥇',lb:'Đạt xuất sắc',msg:'Xuất sắc! Bạn đã nắm vững kiến thức bài học!',c:'good'}
         :sc>=800?{ic:'🌟',bi:'🥈',lb:'Đạt giỏi',msg:'Rất tốt! Bạn đã nắm chắc phần lớn kiến thức bài học!',c:'good'}
         :{ic:'📚',bi:'🌱',lb:'Chưa đạt',msg:'Đừng bỏ cuộc! Hãy xem lại phần giải thích, ôn tập thêm và thử lại nhé!',c:'bad'};
  SC=sc;
  app.innerHTML=`<div class="rb ${T.c}"><span>${T.ic}</span>${T.msg}</div>
  <div class="card end" style="margin-top:14px"><div class="rl">Kết quả bài làm</div>
  <p class="rwho">👤 <b>${esc(who.name)}</b> · ${esc(clsLabel(who.cls))}, ${esc(who.school)}</p>
  <div class="rsc">${sc}<small>/1000</small></div>
  <div class="rbadge ${T.c}"><span>${T.bi}</span>${T.lb.toUpperCase()}</div>
  <p class="rinfo">Bạn trả lời đúng <b>${right}/${Q.length}</b> câu hỏi.</p>
  <p class="rinfo">⏱ Tổng thời gian làm bài: <b>${tm}</b></p>
  <p id="sv" style="font-size:14px;margin:8px 0 14px">Đang lưu điểm…</p><div class="rbtns"><button class="go" onclick="begin()">↻ Làm lại</button><button class="go alt" onclick="location.reload()">Đổi học sinh</button></div></div>`;
  save();
}
async function save(){
  const {error}=await sb.rpc('submit_attempt',{p_class:cls.id,p_student:stu,p_quiz:qid,p_score:SC,p_total:1000,p_answers:A});
  $('#sv').innerHTML=error?'<span class="err">Chưa lưu được điểm.</span> <button class="go" id="rt">Thử lại</button>':'<span class="okc">Đã lưu điểm ✓</span>';
  if(error)$('#rt').onclick=save;
}
</script></body></html>
